<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Pour Hobii — avec amour</title>
  <meta name="description" content="Un petit site juste pour te dire que je t'aime, Hobii." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Outfit:wght@300;400;500&family=Great+Vibes&display=swap" rel="stylesheet" />
  <style>
    :root {
      --night: #1a0f16;
      --dusk: #3d1a2a;
      --blush: #ff8fab;
      --rose: #ff5c8a;
      --petal: #ffe0ea;
      --gold: #ffd6a5;
      --cream: #fff5f8;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      min-height: 100%;
      overflow-x: hidden;
    }

    body {
      font-family: "Outfit", system-ui, sans-serif;
      color: var(--cream);
      background: var(--night);
      min-height: 100dvh;
      display: grid;
      place-items: center;
      position: relative;
    }

    .sky {
      position: fixed;
      inset: 0;
      background:
        radial-gradient(ellipse 90% 70% at 50% 15%, #5a2038 0%, transparent 55%),
        radial-gradient(ellipse 60% 50% at 80% 80%, #2a1220 0%, transparent 50%),
        radial-gradient(ellipse 50% 40% at 15% 70%, #3a1830 0%, transparent 45%),
        linear-gradient(165deg, #12080e 0%, #2a121c 45%, #1a0f16 100%);
      z-index: 0;
    }

    .vignette {
      position: fixed;
      inset: 0;
      pointer-events: none;
      background: radial-gradient(ellipse at center, transparent 40%, rgba(10, 4, 8, 0.55) 100%);
      z-index: 2;
    }

    #fx {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 1;
    }

    .stage {
      position: relative;
      z-index: 3;
      width: min(92vw, 640px);
      padding: clamp(2.5rem, 8vw, 4.5rem) clamp(1.25rem, 5vw, 2.5rem);
      text-align: center;
      animation: rise 1.4s cubic-bezier(0.22, 1, 0.36, 1) both;
    }

    @keyframes rise {
      from { opacity: 0; transform: translateY(28px) scale(0.98); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }

    .orb {
      position: absolute;
      left: 50%;
      top: 42%;
      width: min(70vw, 420px);
      height: min(70vw, 420px);
      transform: translate(-50%, -50%);
      border-radius: 50%;
      background: radial-gradient(circle, rgba(255, 92, 138, 0.22) 0%, transparent 68%);
      filter: blur(8px);
      animation: pulse 4.5s ease-in-out infinite;
      z-index: -1;
      pointer-events: none;
    }

    @keyframes pulse {
      0%, 100% { opacity: 0.7; transform: translate(-50%, -50%) scale(1); }
      50% { opacity: 1; transform: translate(-50%, -50%) scale(1.08); }
    }

    .eyebrow {
      font-size: 0.75rem;
      letter-spacing: 0.35em;
      text-transform: uppercase;
      font-weight: 400;
      color: var(--gold);
      opacity: 0.85;
      margin-bottom: 1.75rem;
      animation: fade 1.2s 0.3s both;
    }

    h1 {
      font-family: "Cormorant Garamond", Georgia, serif;
      font-weight: 500;
      font-style: italic;
      font-size: clamp(1.85rem, 6.5vw, 3.15rem);
      line-height: 1.28;
      color: var(--petal);
      text-wrap: balance;
      text-shadow: 0 0 40px rgba(255, 92, 138, 0.35);
      animation: fade 1.2s 0.5s both;
    }

    h1 .name {
      display: inline-block;
      color: var(--rose);
      font-style: italic;
      position: relative;
      animation: glow 2.8s ease-in-out infinite;
    }

    @keyframes glow {
      0%, 100% { text-shadow: 0 0 12px rgba(255, 92, 138, 0.4); }
      50% { text-shadow: 0 0 28px rgba(255, 140, 170, 0.85), 0 0 48px rgba(255, 92, 138, 0.4); }
    }

    .heart-row {
      display: flex;
      justify-content: center;
      gap: 0.85rem;
      margin: 2rem 0 1.75rem;
      animation: fade 1.2s 0.75s both;
    }

    .heart-row span {
      display: inline-block;
      font-size: 1.15rem;
      color: var(--blush);
      animation: floaty 2.4s ease-in-out infinite;
      filter: drop-shadow(0 0 8px rgba(255, 92, 138, 0.55));
    }

    .heart-row span:nth-child(2) { animation-delay: 0.35s; font-size: 1.55rem; color: var(--rose); }
    .heart-row span:nth-child(3) { animation-delay: 0.7s; }

    @keyframes floaty {
      0%, 100% { transform: translateY(0) scale(1); }
      50% { transform: translateY(-8px) scale(1.12); }
    }

    .sig {
      margin-top: 0.5rem;
      animation: fade 1.2s 1s both;
    }

    .sig p {
      font-size: 0.8rem;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: rgba(255, 245, 248, 0.55);
      margin-bottom: 0.35rem;
    }

    .sig .sign {
      font-family: "Great Vibes", cursive;
      font-size: clamp(2.4rem, 8vw, 3.6rem);
      color: var(--gold);
      line-height: 1.2;
      text-shadow: 0 0 24px rgba(255, 214, 165, 0.35);
    }

    .tap {
      margin-top: 2.5rem;
      font-size: 0.8rem;
      color: rgba(255, 224, 234, 0.55);
      letter-spacing: 0.06em;
      animation: fade 1.2s 1.3s both, softblink 2.5s 2.5s ease-in-out infinite;
      cursor: pointer;
      user-select: none;
      border: none;
      background: none;
      font-family: inherit;
    }

    .tap:focus-visible {
      outline: 1px solid var(--blush);
      outline-offset: 6px;
      border-radius: 4px;
    }

    @keyframes fade {
      from { opacity: 0; transform: translateY(12px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @keyframes softblink {
      0%, 100% { opacity: 0.45; }
      50% { opacity: 0.85; }
    }

    .burst-heart {
      position: fixed;
      pointer-events: none;
      z-index: 10;
      font-size: 1.4rem;
      animation: burst 1.1s ease-out forwards;
    }

    @keyframes burst {
      0% { opacity: 1; transform: translate(0, 0) scale(0.6); }
      100% { opacity: 0; transform: translate(var(--dx), var(--dy)) scale(1.3); }
    }
  </style>
</head>
<body>
  <div class="sky" aria-hidden="true"></div>
  <canvas id="fx" aria-hidden="true"></canvas>
  <div class="vignette" aria-hidden="true"></div>

  <main class="stage">
    <div class="orb" aria-hidden="true"></div>
    <p class="eyebrow">Une déclaration · rien que pour toi</p>
    <h1>
      J’ai créé un site juste pour te dire que je t’aime,
      <span class="name">Hobii</span>
    </h1>
    <div class="heart-row" aria-hidden="true">
      <span>♥</span><span>♥</span><span>♥</span>
    </div>
    <div class="sig">
      <p>signé</p>
      <div class="sign">le grand H</div>
    </div>
    <button class="tap" type="button" id="spark">touche l’écran · encore des cœurs</button>
  </main>

  <script>
    (() => {
      const canvas = document.getElementById("fx");
      const ctx = canvas.getContext("2d");
      let w, h, sparks = [], hearts = [];

      function resize() {
        w = canvas.width = window.innerWidth;
        h = canvas.height = window.innerHeight;
      }
      window.addEventListener("resize", resize);
      resize();

      function makeSpark() {
        return {
          x: Math.random() * w,
          y: Math.random() * h,
          r: Math.random() * 1.8 + 0.4,
          a: Math.random(),
          s: Math.random() * 0.015 + 0.004,
          tw: Math.random() * Math.PI * 2,
        };
      }

      function makeHeart() {
        const size = Math.random() * 14 + 8;
        return {
          x: Math.random() * w,
          y: h + Math.random() * 80 + 20,
          size,
          speed: Math.random() * 0.6 + 0.25,
          drift: (Math.random() - 0.5) * 0.4,
          rot: Math.random() * Math.PI,
          spin: (Math.random() - 0.5) * 0.02,
          alpha: Math.random() * 0.45 + 0.25,
          hue: Math.random() > 0.5 ? "#ff8fab" : "#ff5c8a",
        };
      }

      for (let i = 0; i < 90; i++) sparks.push(makeSpark());
      for (let i = 0; i < 18; i++) {
        const ht = makeHeart();
        ht.y = Math.random() * h;
        hearts.push(ht);
      }

      function drawHeartPath(x, y, s, rot) {
        ctx.save();
        ctx.translate(x, y);
        ctx.rotate(rot);
        ctx.beginPath();
        const k = s / 16;
        ctx.moveTo(0, 3 * k);
        ctx.bezierCurveTo(-10 * k, -8 * k, -16 * k, 4 * k, 0, 14 * k);
        ctx.bezierCurveTo(16 * k, 4 * k, 10 * k, -8 * k, 0, 3 * k);
        ctx.fill();
        ctx.restore();
      }

      function frame(t) {
        ctx.clearRect(0, 0, w, h);

        for (const p of sparks) {
          p.tw += p.s;
          const twinkle = 0.35 + 0.65 * Math.abs(Math.sin(p.tw));
          ctx.beginPath();
          ctx.fillStyle = `rgba(255, 230, 210, ${p.a * twinkle})`;
          ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
          ctx.fill();
          if (p.r > 1.2) {
            ctx.beginPath();
            ctx.strokeStyle = `rgba(255, 214, 165, ${0.25 * twinkle})`;
            ctx.lineWidth = 0.6;
            ctx.moveTo(p.x - p.r * 2.2, p.y);
            ctx.lineTo(p.x + p.r * 2.2, p.y);
            ctx.moveTo(p.x, p.y - p.r * 2.2);
            ctx.lineTo(p.x, p.y + p.r * 2.2);
            ctx.stroke();
          }
        }

        for (const ht of hearts) {
          ht.y -= ht.speed;
          ht.x += Math.sin(t / 900 + ht.y / 40) * ht.drift;
          ht.rot += ht.spin;
          if (ht.y < -40) {
            Object.assign(ht, makeHeart());
          }
          ctx.globalAlpha = ht.alpha;
          ctx.fillStyle = ht.hue;
          drawHeartPath(ht.x, ht.y, ht.size, ht.rot);
          ctx.globalAlpha = 1;
        }

        requestAnimationFrame(frame);
      }
      requestAnimationFrame(frame);

      function burstAt(x, y) {
        for (let i = 0; i < 12; i++) {
          const el = document.createElement("span");
          el.className = "burst-heart";
          el.textContent = Math.random() > 0.3 ? "♥" : "✨";
          const angle = (Math.PI * 2 * i) / 12;
          const dist = 40 + Math.random() * 70;
          el.style.left = x + "px";
          el.style.top = y + "px";
          el.style.setProperty("--dx", Math.cos(angle) * dist + "px");
          el.style.setProperty("--dy", Math.sin(angle) * dist + "px");
          el.style.color = Math.random() > 0.5 ? "#ff8fab" : "#ffd6a5";
          document.body.appendChild(el);
          setTimeout(() => el.remove(), 1100);
        }
      }

      document.getElementById("spark").addEventListener("click", (e) => {
        burstAt(e.clientX, e.clientY);
      });

      document.addEventListener("pointerdown", (e) => {
        if (e.target.closest("button")) return;
        burstAt(e.clientX, e.clientY);
      });
    })();
  </script>
</body>
</html>
