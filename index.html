<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#140810" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="format-detection" content="telephone=no" />
  <title>Pour Hobii — avec amour</title>
  <meta name="description" content="J’ai créé un site juste pour te dire que je t’aime, Hobii." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;1,500;1,600&family=Outfit:wght@300;400;500&family=Great+Vibes&display=swap" rel="stylesheet" />
  <style>
    :root {
      --night: #140810;
      --blush: #ff9bb8;
      --rose: #ff4f86;
      --petal: #ffe6ef;
      --gold: #ffd4a8;
      --cream: #fff7fa;
      --safe-top: env(safe-area-inset-top, 0px);
      --safe-bottom: env(safe-area-inset-bottom, 0px);
      --safe-left: env(safe-area-inset-left, 0px);
      --safe-right: env(safe-area-inset-right, 0px);
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html {
      height: 100%;
      -webkit-text-size-adjust: 100%;
      text-size-adjust: 100%;
    }

    body {
      font-family: "Outfit", system-ui, -apple-system, sans-serif;
      color: var(--cream);
      background: var(--night);
      min-height: 100%;
      min-height: 100dvh;
      min-height: -webkit-fill-available;
      overflow: hidden;
      position: relative;
      -webkit-tap-highlight-color: transparent;
      touch-action: manipulation;
      user-select: none;
      -webkit-user-select: none;
    }

    .sky {
      position: fixed;
      inset: 0;
      background:
        radial-gradient(ellipse 120% 70% at 50% -5%, #7a2a48 0%, transparent 52%),
        radial-gradient(ellipse 80% 55% at 100% 85%, #3a1528 0%, transparent 50%),
        radial-gradient(ellipse 70% 50% at 0% 75%, #4a1a30 0%, transparent 48%),
        linear-gradient(168deg, #0c060a 0%, #24101a 42%, #140810 100%);
      z-index: 0;
    }

    .bloom {
      position: fixed;
      left: 50%;
      top: 38%;
      width: min(92vw, 28rem);
      height: min(92vw, 28rem);
      transform: translate(-50%, -50%);
      border-radius: 50%;
      background:
        radial-gradient(circle at 50% 45%, rgba(255, 79, 134, 0.34) 0%, rgba(255, 79, 134, 0.12) 38%, transparent 68%);
      filter: blur(2px);
      animation: bloom 5.5s ease-in-out infinite;
      z-index: 0;
      pointer-events: none;
    }

    @keyframes bloom {
      0%, 100% { opacity: 0.75; transform: translate(-50%, -50%) scale(1); }
      50% { opacity: 1; transform: translate(-50%, -50%) scale(1.12); }
    }

    .vignette {
      position: fixed;
      inset: 0;
      pointer-events: none;
      background:
        radial-gradient(ellipse at 50% 42%, transparent 28%, rgba(8, 2, 6, 0.55) 100%),
        linear-gradient(to top, rgba(8, 2, 6, 0.45) 0%, transparent 28%),
        linear-gradient(to bottom, rgba(8, 2, 6, 0.25) 0%, transparent 18%);
      z-index: 2;
    }

    #fx {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 1;
    }

    .shell {
      position: relative;
      z-index: 3;
      min-height: 100dvh;
      min-height: -webkit-fill-available;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding:
        max(1.25rem, var(--safe-top))
        max(1.15rem, var(--safe-right))
        max(1.5rem, calc(var(--safe-bottom) + 0.75rem))
        max(1.15rem, var(--safe-left));
    }

    .stage {
      width: min(100%, 34rem);
      text-align: center;
      animation: rise 1.25s cubic-bezier(0.22, 1, 0.36, 1) both;
    }

    @keyframes rise {
      from { opacity: 0; transform: translateY(1.4rem) scale(0.985); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }

    .eyebrow {
      display: inline-flex;
      align-items: center;
      gap: 0.55rem;
      font-size: clamp(0.62rem, 2.6vw, 0.72rem);
      letter-spacing: 0.28em;
      text-transform: uppercase;
      font-weight: 400;
      color: var(--gold);
      opacity: 0.9;
      margin-bottom: clamp(1.1rem, 4.5vh, 1.85rem);
      padding: 0.45rem 0.85rem;
      border: 1px solid rgba(255, 212, 168, 0.22);
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.03);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      animation: fade 1.1s 0.2s both;
      max-width: 100%;
    }

    .eyebrow::before,
    .eyebrow::after {
      content: "✦";
      font-size: 0.55rem;
      opacity: 0.7;
      letter-spacing: 0;
    }

    h1 {
      font-family: "Cormorant Garamond", Georgia, serif;
      font-weight: 500;
      font-style: italic;
      font-size: clamp(1.7rem, 7.8vw, 3.05rem);
      line-height: 1.22;
      color: var(--petal);
      text-wrap: balance;
      text-shadow: 0 0 2rem rgba(255, 79, 134, 0.4);
      animation: fade 1.1s 0.4s both;
      padding-inline: 0.15rem;
    }

    h1 .line {
      display: block;
    }

    h1 .name {
      display: inline-block;
      margin-top: 0.35rem;
      color: var(--rose);
      font-style: italic;
      font-size: 1.08em;
      letter-spacing: 0.02em;
      animation: glow 2.8s ease-in-out infinite;
    }

    @keyframes glow {
      0%, 100% { text-shadow: 0 0 0.75rem rgba(255, 79, 134, 0.45); transform: scale(1); }
      50% { text-shadow: 0 0 1.6rem rgba(255, 155, 184, 0.95), 0 0 2.8rem rgba(255, 79, 134, 0.45); transform: scale(1.03); }
    }

    .divider {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.7rem;
      margin: clamp(1.35rem, 4.5vh, 2.1rem) auto;
      animation: fade 1.1s 0.65s both;
    }

    .divider span {
      width: clamp(2rem, 10vw, 3.5rem);
      height: 1px;
      background: linear-gradient(90deg, transparent, rgba(255, 212, 168, 0.55), transparent);
    }

    .divider .hearts {
      display: flex;
      gap: 0.55rem;
      align-items: center;
    }

    .divider .hearts i {
      font-style: normal;
      font-size: clamp(0.95rem, 3.8vw, 1.2rem);
      color: var(--blush);
      animation: floaty 2.35s ease-in-out infinite;
      filter: drop-shadow(0 0 0.55rem rgba(255, 79, 134, 0.6));
      line-height: 1;
    }

    .divider .hearts i:nth-child(2) {
      animation-delay: 0.35s;
      font-size: clamp(1.25rem, 5vw, 1.55rem);
      color: var(--rose);
    }

    .divider .hearts i:nth-child(3) { animation-delay: 0.7s; }

    @keyframes floaty {
      0%, 100% { transform: translateY(0) scale(1); }
      50% { transform: translateY(-0.45rem) scale(1.12); }
    }

    .sig {
      animation: fade 1.1s 0.9s both;
    }

    .sig .label {
      font-size: clamp(0.68rem, 2.8vw, 0.78rem);
      letter-spacing: 0.22em;
      text-transform: uppercase;
      color: rgba(255, 247, 250, 0.5);
      margin-bottom: 0.2rem;
    }

    .sig .sign {
      font-family: "Great Vibes", cursive;
      font-size: clamp(2.55rem, 12vw, 3.75rem);
      color: var(--gold);
      line-height: 1.15;
      text-shadow: 0 0 1.4rem rgba(255, 212, 168, 0.4);
      padding-inline: 0.25rem;
    }

    .tap {
      margin-top: clamp(1.6rem, 5vh, 2.4rem);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.45rem;
      min-height: 2.75rem;
      padding: 0.7rem 1.15rem;
      border-radius: 999px;
      border: 1px solid rgba(255, 155, 184, 0.28);
      background: rgba(255, 79, 134, 0.1);
      color: rgba(255, 230, 239, 0.82);
      font: inherit;
      font-size: clamp(0.72rem, 3.1vw, 0.82rem);
      letter-spacing: 0.04em;
      cursor: pointer;
      animation: fade 1.1s 1.15s both, softblink 2.6s 2.4s ease-in-out infinite;
      -webkit-backdrop-filter: blur(10px);
      backdrop-filter: blur(10px);
      transition: transform 0.2s ease, background 0.2s ease, border-color 0.2s ease;
      max-width: min(100%, 20rem);
    }

    .tap:active {
      transform: scale(0.96);
      background: rgba(255, 79, 134, 0.2);
      border-color: rgba(255, 155, 184, 0.5);
    }

    .tap:focus-visible {
      outline: 2px solid var(--blush);
      outline-offset: 3px;
    }

    @keyframes fade {
      from { opacity: 0; transform: translateY(0.85rem); }
      to { opacity: 1; transform: translateY(0); }
    }

    @keyframes softblink {
      0%, 100% { opacity: 0.72; }
      50% { opacity: 1; }
    }

    .burst {
      position: fixed;
      pointer-events: none;
      z-index: 20;
      font-size: clamp(1.1rem, 4.5vw, 1.55rem);
      will-change: transform, opacity;
      animation: burst 1s cubic-bezier(0.2, 0.7, 0.3, 1) forwards;
      filter: drop-shadow(0 0 0.4rem rgba(255, 79, 134, 0.55));
    }

    @keyframes burst {
      0% { opacity: 1; transform: translate(0, 0) scale(0.55) rotate(0deg); }
      100% { opacity: 0; transform: translate(var(--dx), var(--dy)) scale(1.35) rotate(var(--rot)); }
    }

    @media (min-width: 640px) {
      h1 { font-size: clamp(2.35rem, 4.5vw, 3.15rem); }
      .eyebrow { letter-spacing: 0.32em; }
    }

    @media (max-height: 640px) and (orientation: landscape) {
      .shell { justify-content: flex-start; padding-block: 1rem; overflow-y: auto; }
      h1 { font-size: clamp(1.35rem, 5.5vh, 2rem); }
      .sig .sign { font-size: clamp(2rem, 8vh, 2.8rem); }
      .tap { margin-top: 1rem; }
      .divider { margin-block: 0.85rem; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.01ms !important;
      }
    }
  </style>
</head>
<body>
  <div class="sky" aria-hidden="true"></div>
  <div class="bloom" aria-hidden="true"></div>
  <canvas id="fx" aria-hidden="true"></canvas>
  <div class="vignette" aria-hidden="true"></div>

  <div class="shell">
    <main class="stage">
      <p class="eyebrow">rien que pour toi</p>
      <h1>
        <span class="line">J’ai créé un site juste pour te dire</span>
        <span class="line">que je t’aime,</span>
        <span class="name">Hobii</span>
      </h1>
      <div class="divider" aria-hidden="true">
        <span></span>
        <div class="hearts"><i>♥</i><i>♥</i><i>♥</i></div>
        <span></span>
      </div>
      <div class="sig">
        <p class="label">signé</p>
        <div class="sign">le grand H</div>
      </div>
      <button class="tap" type="button" id="spark" aria-label="Faire apparaître des cœurs">
        <span aria-hidden="true">♥</span>
        touche l’écran
        <span aria-hidden="true">✨</span>
      </button>
    </main>
  </div>

  <script>
    (() => {
      const canvas = document.getElementById("fx");
      const ctx = canvas.getContext("2d", { alpha: true });
      const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
      let w = 0, h = 0, dpr = 1, sparks = [], hearts = [], raf = 0;

      const isMobile = () => Math.min(window.innerWidth, window.innerHeight) < 720
        || matchMedia("(pointer: coarse)").matches;

      function resize() {
        dpr = Math.min(window.devicePixelRatio || 1, isMobile() ? 2 : 2.5);
        w = window.innerWidth;
        h = window.innerHeight;
        canvas.width = Math.floor(w * dpr);
        canvas.height = Math.floor(h * dpr);
        canvas.style.width = w + "px";
        canvas.style.height = h + "px";
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      }

      function makeSpark() {
        return {
          x: Math.random() * w,
          y: Math.random() * h,
          r: Math.random() * (isMobile() ? 1.5 : 1.9) + 0.35,
          a: Math.random() * 0.85 + 0.15,
          s: Math.random() * 0.016 + 0.004,
          tw: Math.random() * Math.PI * 2,
        };
      }

      function makeHeart(fromBottom) {
        const size = Math.random() * (isMobile() ? 12 : 15) + 7;
        return {
          x: Math.random() * w,
          y: fromBottom === false ? Math.random() * h : h + Math.random() * 90 + 20,
          size,
          speed: Math.random() * 0.55 + 0.22,
          drift: (Math.random() - 0.5) * 0.45,
          rot: Math.random() * Math.PI,
          spin: (Math.random() - 0.5) * 0.02,
          alpha: Math.random() * 0.42 + 0.22,
          hue: Math.random() > 0.45 ? "#ff9bb8" : "#ff4f86",
        };
      }

      function seed() {
        const mobile = isMobile();
        sparks = Array.from({ length: mobile ? 55 : 95 }, makeSpark);
        hearts = Array.from({ length: mobile ? 12 : 18 }, () => makeHeart(false));
      }

      function drawHeartPath(x, y, s, rot) {
        ctx.save();
        ctx.translate(x, y);
        ctx.rotate(rot);
        ctx.beginPath();
        const k = s / 16;
        ctx.moveTo(0, 3 * k);
        ctx.bezierCurveTo(-10 * k, -8 * k, -16 * k, 4 * k, 0, 14 * k);
        ctx.bezierCurveTo(16 * k, 4 * k, 10 * k, -8 * k, 0, 3 * k);
        ctx.fill();
        ctx.restore();
      }

      function frame(t) {
        ctx.clearRect(0, 0, w, h);

        for (const p of sparks) {
          p.tw += p.s;
          const twinkle = 0.3 + 0.7 * Math.abs(Math.sin(p.tw));
          ctx.beginPath();
          ctx.fillStyle = `rgba(255, 232, 214, ${p.a * twinkle})`;
          ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
          ctx.fill();
          if (p.r > 1.15) {
            ctx.beginPath();
            ctx.strokeStyle = `rgba(255, 212, 168, ${0.28 * twinkle})`;
            ctx.lineWidth = 0.55;
            const arm = p.r * 2.3;
            ctx.moveTo(p.x - arm, p.y);
            ctx.lineTo(p.x + arm, p.y);
            ctx.moveTo(p.x, p.y - arm);
            ctx.lineTo(p.x, p.y + arm);
            ctx.stroke();
          }
        }

        for (const ht of hearts) {
          ht.y -= ht.speed;
          ht.x += Math.sin(t / 900 + ht.y / 40) * ht.drift;
          ht.rot += ht.spin;
          if (ht.y < -40) Object.assign(ht, makeHeart(true));
          ctx.globalAlpha = ht.alpha;
          ctx.fillStyle = ht.hue;
          drawHeartPath(ht.x, ht.y, ht.size, ht.rot);
          ctx.globalAlpha = 1;
        }

        raf = requestAnimationFrame(frame);
      }

      function burstAt(x, y) {
        if (navigator.vibrate) navigator.vibrate(12);
        const count = isMobile() ? 14 : 16;
        for (let i = 0; i < count; i++) {
          const el = document.createElement("span");
          el.className = "burst";
          el.textContent = Math.random() > 0.28 ? "♥" : "✨";
          const angle = (Math.PI * 2 * i) / count + Math.random() * 0.3;
          const dist = (isMobile() ? 48 : 55) + Math.random() * 75;
          el.style.left = x + "px";
          el.style.top = y + "px";
          el.style.setProperty("--dx", Math.cos(angle) * dist + "px");
          el.style.setProperty("--dy", Math.sin(angle) * dist - 18 + "px");
          el.style.setProperty("--rot", (Math.random() * 50 - 25) + "deg");
          el.style.color = Math.random() > 0.45 ? "#ff9bb8" : "#ffd4a8";
          document.body.appendChild(el);
          setTimeout(() => el.remove(), 1000);
        }
      }

      resize();
      seed();
      window.addEventListener("resize", () => {
        resize();
        seed();
      }, { passive: true });

      if (!reduce) raf = requestAnimationFrame(frame);

      const sparkBtn = document.getElementById("spark");
      sparkBtn.addEventListener("pointerup", (e) => {
        burstAt(e.clientX, e.clientY);
      });

      document.addEventListener("pointerdown", (e) => {
        if (e.target.closest("button")) return;
        burstAt(e.clientX, e.clientY);
      }, { passive: true });
    })();
  </script>
</body>
</html>
